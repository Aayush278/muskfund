<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Set Password — MUSKFUND</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
        :root {
            --font-display: 'Outfit', sans-serif;
            --font-body: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --bg: #030712;
            --surface: #0f172a;
            --surface2: #1e293b;
            --border: #334155;
            --green: #00e5ff;
            --green-dim: rgba(0, 229, 255, 0.1);
            --green-mid: rgba(0, 229, 255, 0.3);
            --gold: #f59e0b;
            --red: #ef4444;
            --white: #ffffff;
            --grey: #94a3b8;
            --grey2: #64748b;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            color: var(--white);
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* Background glow */
        body::before {
            content: '';
            position: fixed;
            top: -20%;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 229, 255, 0.07) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 2px;
        }

        /* WRAPPER */
        .page-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 24px 16px;
            animation: fadeUp 0.4s ease both;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* LOGO */
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            margin-bottom: 24px;
        }

        .logo-text {
            font-family: var(--font-display);
            font-size: 22px;
            letter-spacing: 2px;
            color: var(--white);
        }

        .logo-text span {
            color: var(--green);
        }

        /* CARD */
        .card {
            background: linear-gradient(180deg, var(--surface) 0%, var(--bg) 100%);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            padding: 40px;
            box-shadow: 0 0 40px rgba(0, 229, 255, 0.04);
            position: relative;
        }

        /* TOP ICON */
        .card-icon-wrap {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--green-mid), var(--green-dim));
            border: 1px solid var(--green-mid);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.15);
            margin: 0 auto 20px;
        }

        .card-heading {
            font-family: var(--font-display);
            font-size: 28px;
            letter-spacing: 2px;
            text-align: center;
            color: var(--white);
            margin-bottom: 8px;
        }

        .card-subtitle {
            font-family: var(--font-body);
            font-size: 14px;
            color: var(--grey);
            text-align: center;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        /* FORM */
        .field {
            margin-bottom: 20px;
            position: relative;
        }

        .field-label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--grey);
            margin-bottom: 8px;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap input {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 44px 12px 16px;
            font-family: var(--font-body);
            font-size: 14px;
            color: var(--white);
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            min-height: 44px;
        }

        .input-wrap input::placeholder {
            color: var(--grey2);
        }

        .input-wrap input:focus {
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.08);
        }

        .input-wrap input.error-input {
            border-color: var(--red);
        }

        .input-wrap input.success-input {
            border-color: var(--green);
        }

        .toggle-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--grey);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            transition: color 0.2s ease;
            min-width: 28px;
            min-height: 28px;
        }

        .toggle-btn:hover {
            color: var(--white);
        }

        /* STRENGTH BAR */
        .strength-wrap {
            margin-top: 10px;
        }

        .strength-bar {
            width: 100%;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 6px;
        }

        .strength-fill {
            height: 100%;
            border-radius: 2px;
            transition: width 0.3s ease, background-color 0.3s ease;
            width: 0%;
        }

        .strength-text {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* VALIDATION */
        .field-msg {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 7px;
            font-size: 12px;
            min-height: 18px;
        }

        .field-msg.error {
            color: var(--red);
        }

        .field-msg.success {
            color: var(--green);
        }

        .field-msg.hidden {
            visibility: hidden;
        }

        /* SUBMIT BUTTON */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--green);
            color: var(--bg);
            border: none;
            border-radius: 8px;
            font-family: var(--font-body);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s ease;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }

        .btn-submit:hover:not(:disabled) {
            opacity: 0.87;
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* SPINNER */
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(13, 15, 20, 0.3);
            border-top-color: var(--bg);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ERROR MSG BELOW BTN */
        .form-error {
            margin-top: 12px;
            padding: 10px 14px;
            background: rgba(255, 77, 77, 0.08);
            border: 1px solid rgba(255, 77, 77, 0.2);
            border-radius: 8px;
            font-size: 13px;
            color: var(--red);
            display: none;
            align-items: center;
            gap: 8px;
            line-height: 1.4;
        }

        /* BACK LINK */
        .back-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: var(--grey);
        }

        .back-link a {
            color: var(--green);
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.2s ease;
        }

        .back-link a:hover {
            opacity: 0.75;
        }

        /* SUCCESS STATE */
        .success-state {
            text-align: center;
            padding: 8px 0;
            display: none;
        }

        .success-icon-wrap {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--green-dim);
            border: 2px solid var(--green-mid);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            animation: scaleIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0.4);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .success-heading {
            font-family: var(--font-display);
            font-size: 28px;
            letter-spacing: 2px;
            color: var(--green);
            margin-bottom: 10px;
        }

        .success-sub {
            font-size: 14px;
            color: var(--grey);
            line-height: 1.6;
        }

        /* LOADING / BLOCKED */
        .auth-wait {
            text-align: center;
            padding: 32px 0;
        }

        .auth-wait-text {
            font-size: 14px;
            color: var(--grey);
            margin-top: 12px;
        }

        .wait-spinner {
            width: 32px;
            height: 32px;
            border: 2px solid var(--border);
            border-top-color: var(--green);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto;
        }

        /* MOBILE */
        @media (max-width: 768px) {
            body {
                align-items: flex-start;
            }

            .page-wrapper {
                max-width: 100%;
                padding: 0;
                min-height: 100vh;
            }

            .logo {
                padding: 24px 20px 0;
                margin-bottom: 16px;
            }

            .card {
                border-radius: 0;
                border-left: none;
                border-right: none;
                border-bottom: none;
                border-top: 1px solid var(--border);
                padding: 28px 20px 40px;
                min-height: calc(100vh - 80px);
            }
        }
    </style>

    <!-- Mobile Performance Optimizations & Grid Fixes -->
    <style>
        @media (max-width: 768px) {
            body::before, body::after { display: none !important; animation: none !important; }
            .pcard:hover, .stat-card:hover, .card:hover, .pcard-icon, .stat-card-icon { transform: none !important; box-shadow: none !important; }
            .btn-primary, .hero-visual::before, .hero-visual::after, .pulse-indicator { animation: none !important; }
            html { scroll-behavior: auto !important; }
        }
        @media (max-width: 480px) {
            /* Force all multi-column grids to 1 column on very small phones to prevent overflow */
            .stats-grid, .cards-grid, .actions-grid, .two-col-grid, .form-row, .stats-row, .skeleton-stat-row { 
                grid-template-columns: 1fr !important; 
            }
            .data-table-wrap, .txn-table-wrap, .table-wrap {
                overflow-x: auto !important;
                -webkit-overflow-scrolling: touch !important;
            }
        }
    </style>
</head>

<body>

    <div class="page-wrapper">

        <!-- LOGO -->
        <a href="index.html" class="logo">
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="28" height="28" rx="6" fill="rgba(0, 229, 255,0.12)" />
                <polyline points="4,20 10,13 15,16 24,7" stroke="#00e5ff" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" fill="none" />
                <circle cx="24" cy="7" r="2" fill="#00e5ff" />
            </svg>
            <span class="logo-text">MUSK<span>FUND</span></span>
        </a>

        <!-- CARD -->
        <div class="card">

            <!-- AUTH WAIT -->
            <div class="auth-wait" id="authWait">
                <div class="wait-spinner"></div>
                <div class="auth-wait-text">Verifying your session...</div>
            </div>

            <!-- FORM STATE -->
            <div id="formState" style="display:none;">

                <div class="card-icon-wrap">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#00e5ff" stroke-width="1.8"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                    </svg>
                </div>

                <div class="card-heading">Set New Password</div>
                <div class="card-subtitle">Choose a strong password to secure your account.</div>

                <!-- FIELD 1 -->
                <div class="field">
                    <label class="field-label" for="newPassword">New Password</label>
                    <div class="input-wrap">
                        <input type="password" id="newPassword" placeholder="Minimum 8 characters"
                            autocomplete="new-password">
                        <button class="toggle-btn" type="button" onclick="togglePassword('newPassword', this)"
                            aria-label="Toggle password visibility">
                            <!-- Eye open -->
                            <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>

                    <!-- Strength indicator -->
                    <div class="strength-wrap" id="strengthWrap" style="display:none;">
                        <div class="strength-bar">
                            <div class="strength-fill" id="strengthFill"></div>
                        </div>
                        <span class="strength-text" id="strengthText"></span>
                    </div>

                    <div class="field-msg hidden" id="newPwdMsg">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10" />
                            <line x1="12" y1="8" x2="12" y2="12" />
                            <line x1="12" y1="16" x2="12.01" y2="16" />
                        </svg>
                        <span id="newPwdMsgText"></span>
                    </div>
                </div>

                <!-- FIELD 2 -->
                <div class="field">
                    <label class="field-label" for="confirmPassword">Confirm Password</label>
                    <div class="input-wrap">
                        <input type="password" id="confirmPassword" placeholder="Repeat your new password"
                            autocomplete="new-password">
                        <button class="toggle-btn" type="button" onclick="togglePassword('confirmPassword', this)"
                            aria-label="Toggle password visibility">
                            <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>
                    <div class="field-msg hidden" id="confirmPwdMsg">
                        <svg class="msg-icon" width="12" height="12" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                            stroke-linejoin="round"></svg>
                        <span id="confirmPwdMsgText"></span>
                    </div>
                </div>

                <!-- SUBMIT -->
                <button class="btn-submit" id="submitBtn" onclick="handleSubmit()">
                    <div class="spinner" id="btnSpinner"></div>
                    <span id="btnText">Update Password</span>
                </button>

                <!-- FORM ERROR -->
                <div class="form-error" id="formError">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;">
                        <circle cx="12" cy="12" r="10" />
                        <line x1="12" y1="8" x2="12" y2="12" />
                        <line x1="12" y1="16" x2="12.01" y2="16" />
                    </svg>
                    <span id="formErrorText"></span>
                </div>

            </div>

            <!-- SUCCESS STATE -->
            <div class="success-state" id="successState">
                <div class="success-icon-wrap">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#00e5ff" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12" />
                    </svg>
                </div>
                <div class="success-heading">Password Updated</div>
                <div class="success-sub">Your password has been changed.<br>Redirecting you now...</div>
            </div>

        </div><!-- /card -->

        <!-- BACK LINK -->
        <div class="back-link" id="backLink">
            Back to <a href="dashboard.html" id="backAnchor">Dashboard</a>
        </div>

    </div><!-- /page-wrapper -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script>
        let isRecoveryMode = false;
        let userSession = null;
        let userRole = null;
        let authTimeout = null;

        // Eye SVG icons
        const eyeOpen = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
        const eyeClosed = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;

        function togglePassword(fieldId, btn) {
            const input = document.getElementById(fieldId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.innerHTML = eyeClosed;
            } else {
                input.type = 'password';
                btn.innerHTML = eyeOpen;
            }
        }

        function getPasswordStrength(pwd) {
            if (pwd.length < 8) return { level: 'weak', width: '33%', color: 'var(--red)', label: 'Weak' };
            const hasUpper = /[A-Z]/.test(pwd);
            const hasNum = /[0-9]/.test(pwd);
            const hasSpecial = /[^A-Za-z0-9]/.test(pwd);
            if (hasUpper && hasNum && hasSpecial) return { level: 'strong', width: '100%', color: 'var(--green)', label: 'Strong' };
            if (hasNum || hasSpecial) return { level: 'fair', width: '66%', color: 'var(--gold)', label: 'Fair' };
            return { level: 'fair', width: '55%', color: 'var(--gold)', label: 'Fair' };
        }

        function setFieldMsg(id, type, text) {
            const el = document.getElementById(id);
            const textEl = document.getElementById(id + 'Text');
            if (!text) { el.className = 'field-msg hidden'; return; }
            el.className = 'field-msg ' + type;

            // Update icon
            const iconEl = el.querySelector('svg');
            if (iconEl) {
                if (type === 'success') {
                    iconEl.innerHTML = '<polyline points="20 6 9 17 4 12"/>';
                    iconEl.setAttribute('viewBox', '0 0 24 24');
                } else {
                    iconEl.innerHTML = '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>';
                }
            }

            if (textEl) textEl.textContent = text;
        }

        // Password strength listener
        document.getElementById('newPassword').addEventListener('input', function () {
            const val = this.value;
            const strengthWrap = document.getElementById('strengthWrap');
            const fill = document.getElementById('strengthFill');
            const label = document.getElementById('strengthText');

            if (val.length === 0) {
                strengthWrap.style.display = 'none';
                setFieldMsg('newPwdMsg', 'error', '');
                this.className = '';
                return;
            }

            strengthWrap.style.display = 'block';
            const s = getPasswordStrength(val);
            fill.style.width = s.width;
            fill.style.backgroundColor = s.color;
            label.textContent = s.label;
            label.style.color = s.color;

            if (val.length < 8) {
                setFieldMsg('newPwdMsg', 'error', 'Minimum 8 characters required');
                this.classList.add('error-input');
                this.classList.remove('success-input');
            } else {
                setFieldMsg('newPwdMsg', 'error', '');
                this.classList.remove('error-input');
            }

            // Re-check confirm if it has a value
            const confirm = document.getElementById('confirmPassword').value;
            if (confirm.length > 0) validateConfirm();
        });

        function validateConfirm() {
            const pwd = document.getElementById('newPassword').value;
            const confirm = document.getElementById('confirmPassword').value;
            const confirmInput = document.getElementById('confirmPassword');

            if (confirm.length === 0) {
                setFieldMsg('confirmPwdMsg', 'error', '');
                confirmInput.className = '';
                return false;
            }

            if (pwd !== confirm) {
                setFieldMsg('confirmPwdMsg', 'error', 'Passwords do not match');
                confirmInput.classList.add('error-input');
                confirmInput.classList.remove('success-input');
                return false;
            } else {
                setFieldMsg('confirmPwdMsg', 'success', 'Passwords match');
                confirmInput.classList.add('success-input');
                confirmInput.classList.remove('error-input');
                return true;
            }
        }

        document.getElementById('confirmPassword').addEventListener('input', validateConfirm);

        function showFormError(msg) {
            const el = document.getElementById('formError');
            document.getElementById('formErrorText').textContent = msg;
            el.style.display = 'flex';
        }

        function hideFormError() {
            document.getElementById('formError').style.display = 'none';
        }

        function setLoading(loading) {
            const btn = document.getElementById('submitBtn');
            const spinner = document.getElementById('btnSpinner');
            const text = document.getElementById('btnText');
            if (loading) {
                btn.disabled = true;
                spinner.style.display = 'block';
                text.textContent = 'Updating...';
            } else {
                btn.disabled = false;
                spinner.style.display = 'none';
                text.textContent = 'Update Password';
            }
        }

        function showSuccessState() {
            document.getElementById('formState').style.display = 'none';
            document.getElementById('successState').style.display = 'block';
            document.getElementById('backLink').style.display = 'none';

            // Redirect after 2.5 seconds
            setTimeout(() => {
                if (isRecoveryMode && !userSession) {
                    window.location.href = 'index.html';
                } else if (userRole === 'admin') {
                    window.location.href = 'admin-dashboard.html';
                } else {
                    window.location.href = 'dashboard.html';
                }
            }, 2500);
        }

        async function handleSubmit() {
            hideFormError();

            const pwd = document.getElementById('newPassword').value;
            const confirm = document.getElementById('confirmPassword').value;

            // Validate
            if (pwd.length < 8) {
                setFieldMsg('newPwdMsg', 'error', 'Minimum 8 characters required');
                document.getElementById('newPassword').classList.add('error-input');
                return;
            }

            if (pwd !== confirm) {
                setFieldMsg('confirmPwdMsg', 'error', 'Passwords do not match');
                document.getElementById('confirmPassword').classList.add('error-input');
                return;
            }

            setLoading(true);

            try {
                const { data, error } = await db.auth.updateUser({ password: pwd });

                if (error) {
                    let msg = 'Something went wrong. Please try again.';
                    const errMsg = error.message || '';
                    if (errMsg.includes('at least 8')) msg = 'Password should be at least 8 characters.';
                    else if (errMsg.includes('different from')) msg = 'New password should be different from the old password.';
                    else if (errMsg.length > 0) msg = errMsg;
                    showFormError(msg);
                    setLoading(false);
                    return;
                }

                showSuccessState();

            } catch (err) {
                showFormError('Something went wrong. Please try again.');
                setLoading(false);
            }
        }

        // AUTH INIT
        async function initAuth() {
            // 3 second timeout then redirect if no auth
            authTimeout = setTimeout(() => {
                // Only redirect if we truly never got a session
                window.location.href = 'index.html?reason=timeout';
            }, 8000); // Give enough time for PASSWORD_RECOVERY event to fire from email link

            // Check existing session
            try {
                const { data: { session } } = await db.auth.getSession();
                if (session) {
                    clearTimeout(authTimeout);
                    userSession = session;
                    // Fetch role
                    try {
                        const { data: profile } = await db.from('profiles').select('role').eq('id', session.user.id).single();
                        if (profile) userRole = profile.role;
                    } catch (e) { }

                    // Update back link
                    if (userRole === 'admin') {
                        document.getElementById('backAnchor').href = 'admin-dashboard.html';
                        document.getElementById('backAnchor').textContent = 'Admin Dashboard';
                    }

                    showForm();
                    return;
                }
            } catch (e) { }

            // Listen for PASSWORD_RECOVERY event (from reset-password email link)
            // Also handles SIGNED_IN which fires when investor clicks their welcome/confirm email
            db.auth.onAuthStateChange((event, session) => {
                if (event === 'PASSWORD_RECOVERY') {
                    clearTimeout(authTimeout);
                    isRecoveryMode = true;
                    userSession = session;
                    // Fetch role for recovery mode
                    if (session) {
                        db.from('profiles').select('role').eq('id', session.user.id).single()
                            .then(({ data: profile }) => {
                                if (profile) userRole = profile.role;
                                if (userRole === 'admin') {
                                    document.getElementById('backAnchor').href = 'admin-dashboard.html';
                                    document.getElementById('backAnchor').textContent = 'Admin Dashboard';
                                } else {
                                    document.getElementById('backAnchor').href = 'index.html';
                                    document.getElementById('backAnchor').textContent = 'Login';
                                }
                            }).catch(() => {});
                    } else {
                        document.getElementById('backAnchor').href = 'index.html';
                        document.getElementById('backAnchor').textContent = 'Login';
                    }
                    showForm();
                } else if ((event === 'SIGNED_IN') && session && !userSession) {
                    // Investor clicked their welcome/confirmation email link
                    clearTimeout(authTimeout);
                    userSession = session;
                    isRecoveryMode = true; // treat as recovery — they need to set a password
                    // Fetch role
                    db.from('profiles').select('role').eq('id', session.user.id).single()
                        .then(({ data: profile }) => {
                            if (profile) userRole = profile.role;
                        }).catch(() => {});
                    document.getElementById('backAnchor').href = 'index.html';
                    document.getElementById('backAnchor').textContent = 'Login';
                    showForm();
                }
            });
        }

        function showForm() {
            document.getElementById('authWait').style.display = 'none';
            document.getElementById('formState').style.display = 'block';
        }

        // Start
        initAuth();
    </script>
</body>
